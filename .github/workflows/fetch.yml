name: COMPASS ETP — Data Fetch
on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Run all linee
        run: python run_all.py
      - name: Commit and push
        run: |
          git config user.name "COMPASS ETP Bot"
          git config user.email "compass-etp@bot.rwm"
          git add -f data/ || true
          git diff --cached --quiet || git commit -m "COMPASS ETP: aggiornamento dati $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
